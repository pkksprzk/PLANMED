<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Notifications</title>

  <style>
    :root{
      --ink: #001B28;
      --brandText: #224c5d;
      --radius-xl: 28px;

      --glass-tint: rgba(255,255,255,.12);
      --glass-tint-strong: rgba(255,255,255,.16);
      --glass-stroke: rgba(255,255,255,.30);
      --glass-blur: 18px;
      --glass-sat: 140%;
      --glass-shadow: 0 10px 26px rgba(0,0,0,.10);
      --glass-inset-top: inset 0 1px 0 rgba(255,255,255,.28);
      --glass-inset-bottom: inset 0 -1px 0 rgba(0,0,0,.06);

      --topbar-h: 56px;
      --topbar-radius: 999px;
      --topbar-font-size: 14px;
      --topbar-font-weight: 600;

      --topbar-bg: var(--glass-tint);
      --topbar-border: 1px solid var(--glass-stroke);
      --topbar-shadow: var(--glass-shadow);
      --topbar-blur: var(--glass-blur);
      --topbar-sat: var(--glass-sat);

      --teal-grad: linear-gradient(135deg, rgba(0,203,218,.55), rgba(0,160,175,.70));
      --teal-ring: 0 0 0 3px rgba(0,203,218,.16);

      --dot-blue: rgba(0,203,218,.95);
      --muted: rgba(0,27,40,.62);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Helvetica Neue";
      color: var(--ink);
      min-height:100vh;
      background: url("images/dd2.png") center/cover fixed no-repeat;
      overflow-x:hidden;
    }

    body:before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(900px 700px at 18% 12%, rgba(166,180,191,.55), transparent 60%),
        radial-gradient(520px 720px at 55% 35%, rgba(222,231,242,.70), transparent 60%);
      opacity: .85;
    }

    .app{
      max-width: 1280px;
      margin: 0 auto;
      padding: 26px 22px 34px;
      position:relative;
    }

    .glass{
      background: var(--glass-tint);
      border: 1px solid var(--glass-stroke);
      border-radius: var(--radius-xl);
      backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      box-shadow: var(--glass-shadow), var(--glass-inset-top), var(--glass-inset-bottom);
    }


    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      margin-bottom:18px;
      font-size: var(--topbar-font-size);
      font-weight: var(--topbar-font-weight);
    }
    .crumb.logo{ display:flex; align-items:center; }
    .crumb.logo img{
      height: 24px;
      width: auto;
      object-fit: contain;
      opacity: .85;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.12));
    }

    .pill,
    .theme-track{
      height: var(--topbar-h);
      border-radius: var(--topbar-radius);
      background: var(--topbar-bg);
      border: var(--topbar-border);
      backdrop-filter: blur(var(--topbar-blur)) saturate(var(--topbar-sat));
      -webkit-backdrop-filter: blur(var(--topbar-blur)) saturate(var(--topbar-sat));
      box-shadow: var(--topbar-shadow), var(--glass-inset-top), var(--glass-inset-bottom);
    }

    .top-actions{ display:flex; align-items:center; gap:10px; flex:0 0 auto; }
    .pill{
      display:inline-flex;
      align-items:center;
      padding: 0 22px;
      line-height:1;
      cursor:pointer;
      user-select:none;
      transition: background .12s ease, transform .12s ease;
      font-size: 18px;
      font-weight: 600;
      color: var(--brandText);
    }
    .pill:hover{ background: rgba(255,255,255,.18); transform: translateY(-1px); }
    .theme-switch{ display:inline-flex; align-items:center; height: var(--topbar-h); user-select:none; }
    .theme-switch input{ position:absolute; opacity:0; width:1px;height:1px; }
    .theme-track{ position:relative; width: 110px; overflow:hidden; }
    .theme-thumb{
      position:absolute; inset: 0 auto 0 0; width:50%;
      border-radius: 999px;
      background: rgba(255,255,255,.16);
      border: 1px solid rgba(255,255,255,.28);
      box-shadow: 0 8px 18px rgba(0,0,0,.10), inset 0 1px 0 rgba(255,255,255,.28);
      transition: transform .28s cubic-bezier(.2,.9,.2,1);
      z-index:1;
    }
    .theme-switch input:checked + .theme-track .theme-thumb{ transform: translateX(100%); }
    .theme-ico{
      position:absolute; top:50%;
      transform: translate(-50%,-50%);
      width:26px;height:26px;
      pointer-events:none;
      opacity:.95; z-index:2;
    }
    .theme-ico img{ width:26px;height:26px; object-fit:contain; }
    .theme-ico--sun{ left:25%; }
    .theme-ico--moon{ left:75%; }
    .layout{
      display:grid;
      grid-template-columns: 78px 1fr;
      gap: 18px;
      align-items:start;
    }
    .sidebar{ padding: 10px 6px; display:flex; flex-direction:column; position:sticky; top:18px; overflow: visible; }
    .sidenav{ display:flex; flex-direction:column; align-items:center; gap:14px; }
    .side-spacer{ flex:1; }

    .sideitem{
      width:56px;height:56px;display:grid;place-items:center;border-radius:18px;
      position:relative;text-decoration:none;
      transition: transform .12s ease, background .12s ease;
    }
    .sideitem:hover{ transform: translateY(-1px); background: rgba(255,255,255,.10); }
    .sideitem img{ width:22px; height:22px; object-fit:contain; }

    .sideitem.active::after{
      content:"";
      position:absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: var(--teal-grad);
      border: 1px solid rgba(255,255,255,.34);
      box-shadow: 0 10px 22px rgba(0,0,0,.08);
      z-index: -1;
    }
    .sideBadge{
      position:absolute;
      right: 6px;
      bottom: 4px;

      display:none;

      background: none;
      border: 0;
      box-shadow: none;
      padding: 0;
      min-width: 0;
      height: auto;
      border-radius: 0;

      font-size: 18px;
      font-weight: 950;
      line-height: 1;
      color: rgba(0,27,40,.92);

      pointer-events:none;
      z-index: 3;
    }
    @keyframes badgePop {
      0% { transform: scale(1); }
      50% { transform: scale(1.25); }
      100% { transform: scale(1); }
    }
    .sideBadge.pop{
      animation: badgePop .22s cubic-bezier(.2,.9,.2,1);
    }
    @keyframes badgePulse {
  0%   { transform: scale(1);   opacity: 1; }
  50%  { transform: scale(1.18); opacity: .85; }
  100% { transform: scale(1);   opacity: 1; }
}

.sideBadge.pulse{
  animation: badgePulse 1.1s ease-in-out infinite;
}

    .main{
      display:grid;
      grid-template-rows: auto 1fr;
      gap: 18px;
      min-height: calc(100vh - 26px - 34px - 56px - 18px);
    }
    .contentNarrow{ width: 100%; max-width: 980px; margin: 0 auto; }

    .pageTitle{
      padding: 18px 22px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
    }
    .pageTitle h1{
      margin:0;
      font-size: 44px;
      font-weight: 950;
      letter-spacing: .2px;
      color: #2d5e72;
    }

    .titleActions{ display:flex; align-items:center; gap: 10px; flex: 0 0 auto; }

    .btn{
      border:1px solid rgba(255,255,255,.24);
      background: rgba(255,255,255,.12);
      color: rgba(0,27,40,.86);
      padding: 12px 16px;
      border-radius: 16px;
      font-weight: 900;
      cursor:pointer;
      transition: transform .12s ease, background .12s ease, border-color .12s ease, box-shadow .12s ease;
      white-space: nowrap;
      height: 56px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }
    .btn:hover{ transform: translateY(-1px); background: rgba(255,255,255,.16); }

    .btnTeal{
      background: var(--teal-grad);
      border: 1px solid rgba(255,255,255,.34);
      box-shadow: 0 10px 22px rgba(0,0,0,.08);
      color: #fff;
    }
    .btnTeal:hover{ filter: brightness(1.05); }

    .iconBtn{
      width: 56px;
      height: 56px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.34);
      background: var(--teal-grad);
      cursor:pointer;
      display:grid;
      place-items:center;
      transition: transform .12s ease, filter .12s ease, box-shadow .12s ease;
      box-shadow: 0 10px 22px rgba(0,0,0,.08);
    }
    .iconBtn:hover{ transform: translateY(-1px); filter: brightness(1.05); }
    .iconBtn img{ width: 22px; height: 22px; object-fit:contain; }
    .iconBtn.isActive{
      box-shadow:
        0 10px 22px rgba(0,0,0,.08),
        0 0 0 4px rgba(0,203,218,.18);
      filter: brightness(1.06);
    }

    .notifCard{ padding: 18px; min-height: 0; display:flex; flex-direction:column; gap: 12px; }
    .notifScroll{ overflow-y:auto; padding-right: 6px; min-height: 0; flex: 1 1 auto; }

    .dateHead{ display:flex; align-items:center; gap: 10px; margin: 10px 4px 8px; }

    .dateBadge{
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 950;
      color: rgba(0,27,40,.92);
      background: var(--teal-grad);
      border: 1px solid rgba(255,255,255,.34);
      box-shadow: 0 10px 22px rgba(0,0,0,.08);
    }
    .dateLine{ height: 1px; flex:1; background: rgba(255,255,255,.26); }

    .notifItem{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 12px;
      padding: 16px;
      border-radius: 26px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.22);
      cursor:pointer;
      user-select:none;
      margin-bottom: 10px;
    }
    .notifMain{ display:flex; flex-direction:column; gap: 8px; min-width: 0; flex: 1 1 auto; }

    .notifTitle{
      font-size: 18px;
      font-weight: 500;
      color: rgba(0,27,40,.82);
      line-height: 1.25;
      word-break: break-word;
    }

    .notifMeta{
      display:flex;
      align-items:center;
      gap: 12px;
      font-size: 12px;
      font-weight: 500;
      color: rgba(0,27,40,.55);
    }

    .dot{
      width: 14px;height: 14px;border-radius: 50%;
      background: var(--dot-blue);
      box-shadow: 0 0 0 4px rgba(0,203,218,.14);
      transition: opacity .15s ease, transform .15s ease;
    }
    .dot.is-read{ opacity: 0; transform: scale(.7); }

    .xBtn{
      width: 46px;height: 46px;border-radius: 18px;
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.10);
      cursor:pointer;
      display:grid;
      place-items:center;
      font-weight: 950;
      color: rgba(0,27,40,.62);
      flex: 0 0 auto;
    }

    .restoreBtn{
      border: 1px solid rgba(255,255,255,.24);
      background: rgba(255,255,255,.12);
      color: rgba(0,27,40,.88);
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 950;
      cursor:pointer;
      height: 46px;
      align-self:flex-start;
      transition: transform .12s ease, background .12s ease;
      white-space: nowrap;
    }
    .restoreBtn:hover{ transform: translateY(-1px); background: rgba(255,255,255,.16); }

    .rightActions{ display:flex; align-items:center; gap:10px; flex: 0 0 auto; }

    .empty{ padding: 26px 16px; text-align:center; color: rgba(0,27,40,.70); font-weight: 900; }

    body.theme-dark{
      --ink: rgba(255,255,255,.92);
      --glass-tint: rgba(255,255,255,.08);
      --glass-tint-strong: rgba(255,255,255,.12);
      --glass-stroke: rgba(255,255,255,.18);
      --topbar-bg: var(--glass-tint);
      --topbar-border: 1px solid var(--glass-stroke);
    }

    body.theme-dark .notifTitle{ color: rgba(255,255,255,.88); }
    body.theme-dark .notifMeta{ color: rgba(255,255,255,.62); }
    body.theme-dark .sideBadge{ color: rgba(255,255,255,.92); }
  </style>
</head>

<body>
  <div class="app">

    <div class="topbar">
      <div class="crumb logo">
        <img src="images/logog.png" alt="Logo">
      </div>

      <div class="top-actions">
        <label class="theme-switch" aria-label="Change theme">
          <input id="themeToggle" type="checkbox" />
          <span class="theme-track">
            <span class="theme-thumb"></span>
            <span class="theme-ico theme-ico--sun" aria-hidden="true">
              <img src="images/sun.svg" alt="" />
            </span>
            <span class="theme-ico theme-ico--moon" aria-hidden="true">
              <img src="images/moon.svg" alt="" />
            </span>
          </span>
        </label>

        <div class="pill" id="logoutBtn">Log out</div>
      </div>
    </div>

    <div class="layout">
      <aside class="sidebar glass">
        <nav class="sidenav" aria-label="Sidebar">
          <a class="sideitem" href="dashboard.html" data-tip="Dashboard">
            <img src="images/dashboard.svg" alt="Dashboard">
          </a>

          <a class="sideitem" href="patients.html" data-tip="Patients">
            <img src="images/person.svg" alt="Patients">
          </a>

          <a class="sideitem" href="treatmentplan.html" data-tip="Treatment plan">
            <img src="images/add.svg" alt="Treatment plan">
          </a>

          <a class="sideitem active" href="notifications.html" data-tip="Notifications">
            <img src="images/notification.svg" alt="Notifications">
            <span class="sideBadge" id="sidebarUnreadBadge" aria-hidden="true">0</span>
          </a>

          <a class="sideitem" href="calendar.html" data-tip="Calendar">
            <img src="images/calendar.svg" alt="Calendar">
          </a>

          <a class="sideitem" href="task.html" data-tip="Tasks">
            <img src="images/task.svg" alt="Tasks">
          </a>

          <div class="side-spacer"></div>

          <a class="sideitem" href="chat.html" data-tip="Messages">
            <img src="images/chat.svg" alt="Messages">
          </a>

          <a class="sideitem" href="settings.html" data-tip="Settings">
            <img src="images/settings.svg" alt="Settings">
          </a>
        </nav>
      </aside>

      <main class="main">
        <section class="pageTitle glass contentNarrow">
          <h1 id="pageTitleText">Notifications</h1>

          <div class="titleActions">
           
            <button class="iconBtn" id="sortBtn" type="button" aria-label="Sortuj">
              <img src="images/sort.svg" alt="">
            </button>

            <button class="iconBtn" id="trashBtn" type="button" aria-label="Kosz">
              <img src="images/trash.svg" alt="">
            </button>

            <button class="iconBtn" id="backBtn" type="button" aria-label="Powrót" style="display:none;">
              <img src="images/back.svg" alt="">
            </button>

            <button class="btn btnTeal" id="clearAllBtn" type="button">Wyczyść</button>
          </div>
        </section>

        <section class="glass contentNarrow notifCard">
          <div class="notifScroll" id="notifScroll">
            <div id="notifContainer"></div>
            <div class="empty" id="emptyState" style="display:none;">Brak powiadomień.</div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script>
    const toggle = document.getElementById("themeToggle");
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme === "dark") { document.body.classList.add("theme-dark"); toggle.checked = true; }
    toggle.addEventListener("change", () => {
      const isDark = toggle.checked;
      document.body.classList.toggle("theme-dark", isDark);
      localStorage.setItem("theme", isDark ? "dark" : "light");
    });

    document.getElementById("logoutBtn")?.addEventListener("click", () => {
      window.location.href = "index.html";
    });

    let viewMode = "inbox";
    const trashBtn = document.getElementById("trashBtn");
    const backBtn  = document.getElementById("backBtn");
    const pageTitleText = document.getElementById("pageTitleText");

    function setViewMode(mode){
      viewMode = mode;
      const isTrash = viewMode === "trash";
      pageTitleText.textContent = isTrash ? "Trash" : "Notifications";
      trashBtn.style.display = isTrash ? "none" : "";
      backBtn.style.display  = isTrash ? "" : "none";
      renderNotifications();
    }

    trashBtn.addEventListener("click", () => setViewMode("trash"));
    backBtn.addEventListener("click",  () => setViewMode("inbox"));

    let sortMode = "DATE_DESC"; 
    const sortBtn = document.getElementById("sortBtn");

    function updateSortButtonUI(){
      if (!sortBtn) return;
      sortBtn.classList.toggle("isActive", sortMode === "UNREAD_FIRST");
      sortBtn.setAttribute("aria-pressed", String(sortMode === "UNREAD_FIRST"));
      sortBtn.setAttribute(
        "title",
        sortMode === "UNREAD_FIRST"
      );
    }

    sortBtn.addEventListener("click", () => {
      sortMode = (sortMode === "UNREAD_FIRST") ? "DATE_DESC" : "UNREAD_FIRST";
      updateSortButtonUI();
      renderNotifications();
    });

    const NOTIF_KEY = "notificationsData_v1";
    const NOTIF_CHANNEL = "notifications_sync_v1";
    const notiBC = ("BroadcastChannel" in window) ? new BroadcastChannel(NOTIF_CHANNEL) : null;

    function notifyChanged(){
      if (notiBC) notiBC.postMessage({ type:"changed", key: NOTIF_KEY, at: Date.now() });
    }

    function isoAtNoonDaysAgo(daysAgo){
      const now = new Date();
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      d.setDate(d.getDate() - daysAgo);
      d.setHours(12,0,0,0);
      return d.toISOString();
    }

    const seedNotifications = [
      { id:"n1", title:"Patient Adam Miller's appointment has been added for 4:00 PM", createdAt: new Date(Date.now()-2*60*1000).toISOString() },
      { id:"n2", title:"Claudie took scans from patient Anna Kowalski", createdAt: new Date(Date.now()-6*60*60*1000).toISOString() },
      { id:"n3", title:"New message from reception: reschedule request", createdAt: new Date(Date.now()-9*60*60*1000).toISOString() },
      { id:"n4", title:"Patient John Stone completed intake form", createdAt: isoAtNoonDaysAgo(1) },
      { id:"n5", title:"System update scheduled for tonight at 11:00 PM", createdAt: isoAtNoonDaysAgo(1) },
      { id:"n6", title:"Lab: new results available for Anna Kowalski", createdAt: isoAtNoonDaysAgo(2) },
      { id:"n7", title:"Reminder: confirm tomorrow’s appointments", createdAt: isoAtNoonDaysAgo(3) }
    ].map(x => ({ ...x, description:"", readAt:null, deletedAt:null }));

    function loadNotifications(){
      try{
        const raw = localStorage.getItem(NOTIF_KEY);
        if (!raw){
          localStorage.setItem(NOTIF_KEY, JSON.stringify(seedNotifications));
          return [...seedNotifications];
        }
        const arr = JSON.parse(raw);
        const list = Array.isArray(arr) ? arr : [];
        let changed = false;
        for (const s of seedNotifications){
          if (!list.some(n => n.id === s.id)){
            list.push({ ...s });
            changed = true;
          }
        }
        if (changed) localStorage.setItem(NOTIF_KEY, JSON.stringify(list));
        return list;
      }catch{
        localStorage.setItem(NOTIF_KEY, JSON.stringify(seedNotifications));
        return [...seedNotifications];
      }
    }

    function saveNotifications(list){
      localStorage.setItem(NOTIF_KEY, JSON.stringify(list));
      notifyChanged();
    }

    function pad2(n){ return String(n).padStart(2,"0"); }

    function dateKeyISO(iso){
      const d = new Date(iso);
      return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
    }

    function startOfDay(d){
      return new Date(d.getFullYear(), d.getMonth(), d.getDate());
    }

    function formatGroupLabel(iso){
      const d = new Date(iso);
      const now = new Date();
      const diffDays = Math.round((startOfDay(now) - startOfDay(d)) / 864e5);
      if (diffDays === 0) return "Today";
      if (diffDays === 1) return "Yesterday";
      return `${pad2(d.getDate())}.${pad2(d.getMonth()+1)}.${d.getFullYear()}`;
    }

    function timeAgo(iso){
      const t = new Date(iso).getTime();
      const now = Date.now();
      const sec = Math.max(1, Math.floor((now - t) / 1000));
      const min = Math.floor(sec / 60);
      const hr  = Math.floor(min / 60);
      const day = Math.floor(hr / 24);
      if (sec < 60) return "just now";
      if (min < 60) return `${min} minute${min===1?"":"s"} ago`;
      if (hr < 24)  return `${hr} hour${hr===1?"":"s"} ago`;
      return `${day} day${day===1?"":"s"} ago`;
    }

    function escapeHTML(s){
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function inboxNotifications(list){ return list.filter(n => !n.deletedAt); }
    function trashNotifications(list){ return list.filter(n => !!n.deletedAt); }

    function compareByTime(a,b){
      const ta = new Date(a.createdAt).getTime();
      const tb = new Date(b.createdAt).getTime();
      return tb - ta;
    }
    function compareUnreadThenTime(a, b){
  const ar = !!a.readAt;
  const br = !!b.readAt;
  if (ar !== br) return Number(ar) - Number(br); 
  return compareByTime(a, b); 
}


    function groupByDay(items){
      const groups = new Map();
      for (const n of items){
        const key = dateKeyISO(n.createdAt);
        if (!groups.has(key)){
          groups.set(key, { label: formatGroupLabel(n.createdAt), items: [] });
        }
        groups.get(key).items.push(n);
      }
      const keys = Array.from(groups.keys()).sort((a,b) => b.localeCompare(a));
      return { groups, keys };
    }
    function ensureSidebarUnreadBadge(){
  
  let badge = document.getElementById("sidebarUnreadBadge");
  if (badge) return badge;

  const notifLink =
    document.querySelector('.sidenav a[href="notifications.html"]') ||
    document.querySelector('.sidenav a[data-tip="Notifications"]');

  if (!notifLink) return null;

  badge = document.createElement("span");
  badge.className = "sideBadge";
  badge.id = "sidebarUnreadBadge";
  badge.setAttribute("aria-hidden", "true");
  badge.textContent = "0";

  notifLink.appendChild(badge);
  return badge;
}

    const sidebarUnreadBadge = ensureSidebarUnreadBadge();
    let prevUnreadCount = 0;

    function countUnread(list){
      return list.reduce((acc,n) => acc + (!n.deletedAt && !n.readAt ? 1 : 0), 0);
    }

    function updateSidebarUnreadBadge(){
  const badge = document.getElementById("sidebarUnreadBadge") || ensureSidebarUnreadBadge();
  if (!badge) return;

  const list = loadNotifications();
  const unread = countUnread(list);

  if (unread > 0){
    badge.style.display = "block";
    badge.textContent = String(unread);

    badge.classList.add("pulse");

    if (unread > prevUnreadCount){
      badge.classList.remove("pop");
      void badge.offsetWidth;
      badge.classList.add("pop");
    }
  } else {
    badge.style.display = "none";
    badge.classList.remove("pulse");
  }

  prevUnreadCount = unread;
}

    const notifContainer = document.getElementById("notifContainer");
    const emptyState = document.getElementById("emptyState");

    function renderGroupBlock(label, items){
      const wrap = document.createElement("div");
      wrap.className = "dateGroup";
      wrap.innerHTML = `
        <div class="dateHead">
          <div class="dateBadge">${escapeHTML(label)}</div>
          <div class="dateLine"></div>
        </div>
      `;

      for (const it of items){
        const isRead = !!it.readAt;
        const row = document.createElement("div");
        row.className = "notifItem";
        row.setAttribute("data-id", it.id);

        const rightSide = (viewMode === "trash")
          ? `
            <div class="rightActions">
              <button class="restoreBtn" type="button" data-action="restore" aria-label="Restore">Przywróć</button>
            </div>
          `
          : `
            <div class="rightActions">
              <button class="xBtn" type="button" data-action="delete" aria-label="Delete">×</button>
            </div>
          `;

        row.innerHTML = `
          <div class="notifMain">
            <div class="notifTitle">${escapeHTML(it.title)}</div>
            <div class="notifMeta">
              <span>${escapeHTML(timeAgo(it.createdAt))}</span>
              <span class="dot ${isRead ? "is-read" : ""}" aria-label="${isRead ? "Read" : "Unread"}"></span>
            </div>
          </div>
          ${rightSide}
        `;
        wrap.appendChild(row);
      }

      notifContainer.appendChild(wrap);
    }

    function renderNotifications(){
      updateSidebarUnreadBadge();

      const all = loadNotifications();
      const baseItems = (viewMode === "trash") ? trashNotifications(all) : inboxNotifications(all);

      notifContainer.innerHTML = "";
      emptyState.textContent = (viewMode === "trash") ? "Kosz jest pusty." : "Brak powiadomień.";
      emptyState.style.display = baseItems.length ? "none" : "";

      if (!baseItems.length) return;

      if (viewMode === "trash"){
        const { groups, keys } = groupByDay(baseItems.sort(compareByTime));
        for (const k of keys){
          const g = groups.get(k);
          g.items.sort(compareByTime);
          renderGroupBlock(g.label, g.items);
        }
        return;
      }

      if (sortMode === "UNREAD_FIRST"){
        const unreadItems = baseItems.filter(n => !n.readAt);
        const readItems   = baseItems.filter(n => !!n.readAt);

        if (unreadItems.length){
          const { groups, keys } = groupByDay(unreadItems.sort(compareByTime));
          for (const k of keys){
            const g = groups.get(k);
            g.items.sort(compareByTime);
            renderGroupBlock(g.label, g.items);
          }
        }

        if (readItems.length){
          const { groups, keys } = groupByDay(readItems.sort(compareByTime));
          for (const k of keys){
            const g = groups.get(k);
            g.items.sort(compareByTime);
            renderGroupBlock(g.label, g.items);
          }
        }
      } else {
  const { groups, keys } = groupByDay(baseItems.sort(compareByTime));
  for (const k of keys){
    const g = groups.get(k);
    g.items.sort(compareUnreadThenTime); 
    renderGroupBlock(g.label, g.items);
  }
}

    }

    function updateOne(id, patchFn){
      const list = loadNotifications();
      const next = list.map(n => {
        if (n.id !== id) return n;
        const copy = { ...n };
        patchFn(copy);
        return copy;
      });
      saveNotifications(next);
      renderNotifications();
    }

    function trashOne(id){
      updateOne(id, (n) => { n.deletedAt = new Date().toISOString(); });
    }

    function restoreOne(id){
      updateOne(id, (n) => { n.deletedAt = null; });
    }

    function markRead(id){
      updateOne(id, (n) => {
        if (!n.readAt) n.readAt = new Date().toISOString();
      });
    }

    notifContainer.addEventListener("click", (e) => {
      const restoreBtn = e.target.closest('button[data-action="restore"]');
      if (restoreBtn){
        const row = e.target.closest(".notifItem");
        if (!row) return;
        const id = row.getAttribute("data-id");
        if (id) restoreOne(id);
        return;
      }

      const delBtn = e.target.closest('button[data-action="delete"]');
      if (delBtn){
        const row = e.target.closest(".notifItem");
        if (!row) return;
        const id = row.getAttribute("data-id");
        if (id) trashOne(id);
        return;
      }

      if (viewMode !== "inbox") return;
      const row = e.target.closest(".notifItem");
      if (!row) return;
      const id = row.getAttribute("data-id");
      if (!id) return;
      markRead(id);
    });

    document.getElementById("clearAllBtn").addEventListener("click", () => {
      const list = loadNotifications();

      if (viewMode === "trash"){
        const next = list.filter(n => !n.deletedAt);
        saveNotifications(next);
        renderNotifications();
        return;
      }

      const nowIso = new Date().toISOString();
      const next = list.map(n => n.deletedAt ? n : ({ ...n, deletedAt: nowIso }));
      saveNotifications(next);
      renderNotifications();
    });

    window.addEventListener("storage", (e) => {
      if (e.key === NOTIF_KEY) renderNotifications();
    });

    if (notiBC){
      notiBC.addEventListener("message", (ev) => {
        if (ev?.data?.type === "changed") renderNotifications();
      });
    }
 const currentDoctorName =
    localStorage.getItem("currentDoctorName") ||
    localStorage.getItem("currentUserName") ||
    localStorage.getItem("loggedUserName") ||
    localStorage.getItem("doctorName") ||
    "Dr Anna Nowak";

  const TASKS_KEY = "tasksData_v1";
  const TASKS_PING_KEY = "tasksPing_v1";
  const TASKS_CHANNEL = "tasks_sync_v1";

  const tasksBC = ("BroadcastChannel" in window)
    ? new BroadcastChannel(TASKS_CHANNEL)
    : null;

  function fromISODate(s){
    const [y,m,d] = String(s).split("-").map(Number);
    return new Date(y, (m||1)-1, d||1);
  }
  function startOfDay(d){
    const x = new Date(d);
    x.setHours(0,0,0,0);
    return x;
  }
  function daysDiff(fromDate, toDate){
    const a = startOfDay(fromDate).getTime();
    const b = startOfDay(toDate).getTime();
    return Math.round((b - a) / (24*60*60*1000));
  }
  function safeJSONParse(raw, fallback){
    try{
      const v = raw ? JSON.parse(raw) : null;
      return (v === null || v === undefined) ? fallback : v;
    }catch{
      return fallback;
    }
  }
  function loadTasksSafe(){
    const arr = safeJSONParse(localStorage.getItem(TASKS_KEY), []);
    return Array.isArray(arr) ? arr : [];
  }

  function ensureSidebarTasksBadge(){
    let badge = document.getElementById("sidebarTasksBadge");
    if (badge) return badge;

    const tasksLink =
      document.querySelector('.sidenav a[href="task.html"]') ||
      document.querySelector('.sidenav a[data-tip="Tasks"]');

    if (!tasksLink) return null;

    badge = document.createElement("span");
    badge.className = "sideBadge";
    badge.id = "sidebarTasksBadge";
    badge.setAttribute("aria-hidden","true");
    badge.textContent = "0";
    tasksLink.appendChild(badge);
    return badge;
  }

  function updateTasksBadgeGlobal(){
    const badge = document.getElementById("sidebarTasksBadge") || ensureSidebarTasksBadge();
    if (!badge) return;

    const tasks = loadTasksSafe();
    const now = new Date();

    const mineOpen = tasks.filter(t =>
      t && t.status !== "done" && t.assignedTo === currentDoctorName
    );

    const count = mineOpen.reduce((acc, t) => {
      const diff = daysDiff(now, fromISODate(t.dueDate));
      if (diff < 0) return acc + 1;
      if (diff <= 2) return acc + 1;
      return acc;
    }, 0);

    if (count > 0){
      badge.style.display = "block";
      badge.textContent = String(count);
      badge.classList.add("pulse");
    } else {
      badge.style.display = "none";
      badge.classList.remove("pulse");
    }
  }


  updateTasksBadgeGlobal();

  window.addEventListener("storage", (e) => {
    if (e.key === TASKS_KEY || e.key === TASKS_PING_KEY){
      updateTasksBadgeGlobal();
    }
  });

  if (tasksBC){
    tasksBC.addEventListener("message", (ev) => {
      if (ev?.data?.type === "changed") updateTasksBadgeGlobal();
    });
  }
    updateSortButtonUI();
    renderNotifications();
  </script>
