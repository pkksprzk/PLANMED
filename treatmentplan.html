<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Treatment plans</title>

  <style>
    :root{
      --ink: #001B28;
      --brandText: #224c5d;

      --radius-xl: 28px;

      --glass-tint: rgba(255,255,255,.12);
      --glass-tint-strong: rgba(255,255,255,.16);
      --glass-stroke: rgba(255,255,255,.30);
      --glass-blur: 18px;
      --glass-sat: 140%;
      --glass-shadow: 0 10px 26px rgba(0,0,0,.10);
      --glass-inset-top: inset 0 1px 0 rgba(255,255,255,.28);
      --glass-inset-bottom: inset 0 -1px 0 rgba(0,0,0,.06);

      --topbar-h: 56px;
      --topbar-radius: 999px;
      --topbar-font-size: 14px;
      --topbar-font-weight: 600;

      --topbar-bg: var(--glass-tint);
      --topbar-border: 1px solid var(--glass-stroke);
      --topbar-shadow: var(--glass-shadow);
      --topbar-blur: var(--glass-blur);
      --topbar-sat: var(--glass-sat);

      --teal-grad: linear-gradient(135deg, rgba(0,203,218,.55), rgba(0,160,175,.70));
      --teal-ring: 0 0 0 3px rgba(0,203,218,.16);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Helvetica Neue";
      color: var(--ink);
      min-height:100vh;
      background: url("images/dd2.png") center/cover fixed no-repeat;
      overflow-x:hidden;
    }

    body:before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(900px 700px at 18% 12%, rgba(166,180,191,.55), transparent 60%),
        radial-gradient(520px 720px at 55% 35%, rgba(222,231,242,.70), transparent 60%);
      opacity: .85;
    }

    .app{
      max-width: 1280px;
      margin: 0 auto;
      padding: 26px 22px 34px;
      position:relative;
    }

    .glass{
      background: var(--glass-tint);
      border: 1px solid var(--glass-stroke);
      border-radius: var(--radius-xl);
      backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      box-shadow: var(--glass-shadow), var(--glass-inset-top), var(--glass-inset-bottom);
    }
    .glass.strong{ background: var(--glass-tint-strong); }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      margin-bottom:18px;
      font-size: var(--topbar-font-size);
      font-weight: var(--topbar-font-weight);
    }
    .crumb.logo{ display:flex; align-items:center; }
    .crumb.logo img{
      height: 24px;
      width: auto;
      object-fit: contain;
      opacity: .85;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.12));
    }

    .pill,
    .theme-track{
      height: var(--topbar-h);
      border-radius: var(--topbar-radius);
      background: var(--topbar-bg);
      border: var(--topbar-border);
      backdrop-filter: blur(var(--topbar-blur)) saturate(var(--topbar-sat));
      -webkit-backdrop-filter: blur(var(--topbar-blur)) saturate(var(--topbar-sat));
      box-shadow: var(--topbar-shadow), var(--glass-inset-top), var(--glass-inset-bottom);
    }

    .top-actions{ display:flex; align-items:center; gap:10px; flex:0 0 auto; }
    .pill{
      display:inline-flex;
      align-items:center;
      padding: 0 22px;
      line-height:1;
      cursor:pointer;
      user-select:none;
      transition: background .12s ease, transform .12s ease;
      font-size: 18px;
      font-weight: 600;
      color: var(--brandText);
    }
    .pill:hover{ background: rgba(255,255,255,.18); transform: translateY(-1px); }


    .theme-switch{ display:inline-flex; align-items:center; height: var(--topbar-h); user-select:none; }
    .theme-switch input{ position:absolute; opacity:0; width:1px;height:1px; }
    .theme-track{ position:relative; width: 110px; overflow:hidden; }
    .theme-thumb{
      position:absolute; inset: 0 auto 0 0; width:50%;
      border-radius: 999px;
      background: rgba(255,255,255,.16);
      border: 1px solid rgba(255,255,255,.28);
      box-shadow: 0 8px 18px rgba(0,0,0,.10), inset 0 1px 0 rgba(255,255,255,.28);
      transition: transform .28s cubic-bezier(.2,.9,.2,1);
      z-index:1;
    }
    .theme-switch input:checked + .theme-track .theme-thumb{ transform: translateX(100%); }
    .theme-ico{
      position:absolute; top:50%;
      transform: translate(-50%,-50%);
      width:26px;height:26px;
      pointer-events:none;
      opacity:.95; z-index:2;
    }
    .theme-ico img{ width:26px;height:26px; object-fit:contain; }
    .theme-ico--sun{ left:25%; }
    .theme-ico--moon{ left:75%; }
    .theme-switch input:focus-visible + .theme-track{
      outline: 3px solid rgba(0,203,218,.25);
      outline-offset: 3px;
    }


    .layout{
      display:grid;
      grid-template-columns: 78px 1fr;
      gap: 18px;
      align-items:start;
    }

    .sidebar{
      padding: 10px 6px;
      display:flex;
      flex-direction:column;
      position:sticky;
      top:18px;
      overflow: visible;
    }
    .sidenav{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
    }
    .side-spacer{ flex:1; }

    .sideitem{
      width:56px;
      height:56px;
      display:grid;
      place-items:center;
      border-radius:18px;
      position:relative;
      text-decoration:none;
      transition: transform .12s ease, background .12s ease;
    }
    .sideitem:hover{ transform: translateY(-1px); background: rgba(255,255,255,.10); }
    .sideitem img{ width:22px; height:22px; object-fit:contain; }

    .sideitem::before{
      content: attr(data-tip);
      position: absolute;
      left: 50%;
      top: 62px;
      transform: translateX(-50%) translateY(6px);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .2px;
      color: rgba(0,27,40,.70);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity .12s ease, transform .12s ease;
      text-shadow: 0 1px 0 rgba(255,255,255,.45);
    }
    .sideitem:hover::before{ opacity: 1; transform: translateX(-50%) translateY(0); }

    .sideitem.active::after{
      content:"";
      position:absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: var(--teal-grad);
      border: 1px solid rgba(255,255,255,.34);
      box-shadow: 0 10px 22px rgba(0,0,0,.08);
      z-index: -1;
    }


    .main{
      display:grid;
      grid-template-rows: auto 1fr;
      gap: 18px;
      min-height: calc(100vh - 26px - 34px - 56px - 18px);
    }

    .contentNarrow{
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
    }

    .pageTitle{
      padding: 18px 22px;
      text-align:center;
    }
    .pageTitle h1{
      margin:0;
      font-size: 44px;
      font-weight: 950;
      letter-spacing: .2px;
      color: #2d5e72;
    }

    .plansCard{
      padding: 18px;
      min-height: 0;
      display:flex;
      flex-direction:column;
      gap: 12px;
    }

    .listHead{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap: 12px;
      padding: 6px 4px 10px;
      position: relative;
    }
    .listHeadActions{
      display:flex;
      align-items:center;
      gap: 10px;
    }

    .iconHead{
      width: 44px;
      height: 44px;
      border-radius: 16px;
      border: 0;
      background: var(--teal-grad);
      box-shadow: var(--glass-shadow);
      display:grid;
      place-items:center;
      cursor:pointer;
      position:relative;
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    }
    .iconHead:hover{
      transform: translateY(-1px);
      box-shadow: var(--glass-shadow), var(--teal-ring);
      filter: brightness(1.02);
    }
    .iconHead img{ width:22px; height:22px; object-fit:contain; }

    .iconHead::after{
      content: attr(data-tip);
      position:absolute;
      right: 0;
      top: -10px;
      transform: translateY(-100%);
      background: rgba(0,27,40,.78);
      color: rgba(255,255,255,.95);
      font-size: 12px;
      font-weight: 900;
      padding: 8px 10px;
      border-radius: 12px;
      white-space: nowrap;
      opacity: 0;
      pointer-events:none;
      transition: opacity .12s ease, transform .12s ease;
      box-shadow: 0 10px 24px rgba(0,0,0,.18);
    }
    .iconHead:hover::after{
      opacity: 1;
      transform: translateY(-110%);
    }


    .sortMenu{
      position:absolute;
      right: 4px;
      top: 56px;
      width: 260px;
      border-radius: 20px;
      background: rgba(255,255,255,.16);
      border: 1px solid rgba(255,255,255,.28);
      box-shadow: var(--glass-shadow), var(--glass-inset-top), var(--glass-inset-bottom);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      padding: 10px;
      display:none;
      z-index: 20;
    }
    .sortMenu.open{ display:block; }
    .sortItem{
      width:100%;
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.10);
      border-radius: 16px;
      padding: 12px 12px;
      cursor:pointer;
      font-weight: 950;
      color: rgba(0,27,40,.78);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap: 10px;
      transition: transform .12s ease, background .12s ease;
    }
    .sortItem + .sortItem{ margin-top: 8px; }
    .sortItem:hover{ transform: translateY(-1px); background: rgba(255,255,255,.14); }
    .sortItem .hint{ font-size: 12px; font-weight: 900; color: rgba(0,27,40,.55); }

    .listSearch{
      display:none;
      padding: 6px 4px 12px;
      justify-content:center;
    }
    .listSearch.open{ display:flex; }

    .pSearch{
      width: min(520px, 100%);
      height: 56px;
      border-radius: 999px;
      display:flex;
      align-items:center;
      gap:10px;
      padding: 0 18px;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.30);
      box-shadow: var(--glass-shadow), var(--glass-inset-top), var(--glass-inset-bottom);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
    }
    .pSearch svg{ width:20px;height:20px; opacity:.75; stroke: rgba(255,255,255,.85); }
    .pSearch input{
      width:100%;
      border:0;
      outline:none;
      background:transparent;
      color: rgba(255,255,255,.95);
      font-size: 18px;
      font-weight: 600;
    }
    .pSearch input::placeholder{ color: rgba(255,255,255,.75); }

    .scrollarea{
      overflow-y: auto;
      padding-right: 6px;
      flex: 1 1 auto;
      min-height: 0;
    }
    .scrollarea::-webkit-scrollbar{ width: 8px; }
    .scrollarea::-webkit-scrollbar-thumb{
      background: rgba(0,0,0,.12);
      border-radius: 999px;
    }

    .planRow{
      display:flex;
      align-items:center;
      gap: 14px;
      padding: 14px;
      border-radius: 22px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.22);
      backdrop-filter: blur(14px) saturate(120%);
      -webkit-backdrop-filter: blur(14px) saturate(120%);
    }
    .avatar{
      width: 38px;
      height: 38px;
      border-radius: 14px;
      display:grid;
      place-items:center;
      background: rgba(0,203,218,.14);
      border: 1px solid rgba(0,203,218,.22);
      flex: 0 0 auto;
    }
    .avatar svg{ width:20px; height:20px; opacity:.9; }

    .pMain{ display:flex; flex-direction:column; min-width: 260px; }
    .pName{
      font-size: 18px;
      font-weight: 950;
      color: var(--brandText);
      line-height: 1.1;
    }
    .pMeta{
      margin-top: 6px;
      display:flex;
      flex-wrap:wrap;
      gap: 10px 12px;
      font-size: 12px;
      font-weight: 900;
      color: rgba(0,27,40,.62);
    }
    .chip{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.20);
      backdrop-filter: blur(14px) saturate(120%);
      -webkit-backdrop-filter: blur(14px) saturate(120%);
      white-space: nowrap;
    }
    .chip strong{ color: rgba(0,27,40,.82); }

    .pActions{
      margin-left:auto;
      display:flex;
      align-items:center;
      gap: 10px;
      flex: 0 0 auto;
    }
    .btn{
      border:1px solid rgba(255,255,255,.24);
      background: rgba(255,255,255,.12);
      color: rgba(0,27,40,.86);
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 900;
      cursor:pointer;
      backdrop-filter: blur(14px) saturate(120%);
      -webkit-backdrop-filter: blur(14px) saturate(120%);
      transition: transform .12s ease, background .12s ease, border-color .12s ease, box-shadow .12s ease;
      white-space: nowrap;
    }
    .btn:hover{ transform: translateY(-1px); background: rgba(255,255,255,.16); }
    .btn.primary{
      background: var(--teal-grad);
      border: 0 !important;
      box-shadow: var(--glass-shadow) !important;
      color: rgba(255,255,255,.96);
    }

    .empty{
      padding: 26px 16px;
      text-align:center;
      color: rgba(0,27,40,.70);
      font-weight: 900;
    }

    .modalOverlay{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.25);
      display:none;
      align-items:center;
      justify-content:center;
      z-index: 9999;
      padding: 20px;
    }
    .modalOverlay.open{ display:flex; }

    .modal{
      width: min(720px, 100%);
      padding: 18px;
      border-radius: 26px;
      background: rgba(255,255,255,.16);
      border: 1px solid rgba(255,255,255,.28);
      box-shadow: var(--glass-shadow), var(--glass-inset-top), var(--glass-inset-bottom);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
    }
    .modalHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .modalTitle{
      font-weight: 950;
      font-size: 18px;
      color: rgba(0,27,40,.86);
    }
    .iconBtn{
      width: 40px;
      height: 38px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.10);
      cursor:pointer;
      display:grid;
      place-items:center;
      font-weight: 950;
      color: rgba(0,27,40,.70);
    }

    .choiceGrid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 10px;
    }
    .choiceTile{
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.10);
      padding: 18px 14px;
      cursor:pointer;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap: 12px;
      min-height: 170px;
      transition: transform .12s ease, background .12s ease, box-shadow .12s ease;
      backdrop-filter: blur(14px) saturate(120%);
      -webkit-backdrop-filter: blur(14px) saturate(120%);
    }
    .choiceTile:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,.14);
      box-shadow: var(--glass-shadow), var(--teal-ring);
    }
    .choiceIcon{
      width: 74px;
      height: 74px;
      border-radius: 26px;
      background: var(--teal-grad);
      display:grid;
      place-items:center;
      box-shadow: var(--glass-shadow);
    }
    .choiceIcon img{ width:34px; height:34px; object-fit:contain; }
    .choiceLabel{
      font-size: 16px;
      font-weight: 950;
      color: rgba(0,27,40,.82);
      text-align:center;
    }

    .pickerWrap{
      display:flex;
      flex-direction:column;
      gap: 12px;
      min-height: 420px;
    }

    .pickerList{
      flex: 1 1 auto;
      min-height: 0;
    }

    .pickerRow{
      display:flex;
      align-items:center;
      gap: 12px;
      padding: 12px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.20);
      background: rgba(255,255,255,.08);
      cursor:pointer;
      transition: transform .12s ease, background .12s ease;
    }
    .pickerRow:hover{ transform: translateY(-1px); background: rgba(255,255,255,.12); }
    .pickerRow .name{ font-weight: 950; color: var(--brandText); }
    .pickerRow .meta{ margin-top: 4px; font-size: 12px; font-weight: 900; color: rgba(0,27,40,.62); display:flex; gap: 10px; flex-wrap:wrap; }

    .formGrid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .field{ display:flex; flex-direction:column; gap: 6px; }
    .field label{
      font-size: 12px;
      font-weight: 950;
      color: rgba(0,27,40,.70);
      letter-spacing: .2px;
    }
    .field input{
      height: 44px;
      padding: 0 14px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.26);
      background: rgba(255,255,255,.10);
      outline:none;
      font-weight: 900;
      color: rgba(0,27,40,.86);
      backdrop-filter: blur(14px) saturate(120%);
      -webkit-backdrop-filter: blur(14px) saturate(120%);
    }
    .field input::placeholder{ color: rgba(0,27,40,.45); font-weight: 800; }
    .field input.is-disabled{ opacity: .55; }

    .inlineRow{
      grid-column: 1 / -1;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.10);
      backdrop-filter: blur(14px) saturate(120%);
      -webkit-backdrop-filter: blur(14px) saturate(120%);
    }
    .inlineRow label{
      font-size: 12px;
      font-weight: 950;
      color: rgba(0,27,40,.70);
      display:flex;
      align-items:center;
      gap: 10px;
      user-select:none;
      cursor:pointer;
    }
    .inlineRow input[type="checkbox"]{
      width: 18px;
      height: 18px;
      accent-color: rgba(0,203,218,.9);
      cursor:pointer;
    }

    .modalActions{
      margin-top: 14px;
      display:flex;
      justify-content:flex-end;
      gap: 10px;
    }

    @media (max-width: 980px){
      .contentNarrow{ max-width: 100%; }
      .pActions{ flex-wrap: wrap; justify-content:flex-end; }
      .pMain{ min-width: 220px; }
    }
    @media (max-width: 820px){
      .choiceGrid{ grid-template-columns: 1fr; }
      .formGrid{ grid-template-columns: 1fr; }
    }
    @media (max-width: 720px){
      .layout{ grid-template-columns: 1fr; }
      .sidebar{ position:relative; flex-direction:row; justify-content:space-between; }
      .topbar{ gap:10px; }
      .pageTitle h1{ font-size: 32px; }
    }

    body.theme-dark{
      --ink: rgba(255,255,255,.92);
      --glass-tint: rgba(255,255,255,.08);
      --glass-tint-strong: rgba(255,255,255,.12);
      --glass-stroke: rgba(255,255,255,.18);
      --topbar-bg: var(--glass-tint);
      --topbar-border: 1px solid var(--glass-stroke);
    }
    body.theme-dark:before{
      background:
        radial-gradient(900px 700px at 18% 12%, rgba(0,0,0,.55), transparent 60%),
        radial-gradient(520px 720px at 55% 35%, rgba(0,0,0,.45), transparent 60%);
      opacity: .9;
    }
    body.theme-dark .scrollarea::-webkit-scrollbar-thumb{ background: rgba(255,255,255,.12); }
    body.theme-dark .sideitem::before{
      color: rgba(255,255,255,.75);
      text-shadow: 0 1px 0 rgba(0,0,0,.35);
    }

.sideBadge{
  position:absolute;
  right: 6px;
  bottom: 6px;
  display:none;

  background:none;
  border:0;
  box-shadow:none;
  padding:0;
  min-width:0;
  height:auto;
  border-radius:0;

  font-size:14px;
  font-weight:950;
  line-height:1;
  color: rgba(0,27,40,.92);
  pointer-events:none;
  z-index:3;
}

@keyframes badgePulse {
  0%   { transform: scale(1); opacity: 1; }
  50%  { transform: scale(1.18); opacity: .85; }
  100% { transform: scale(1); opacity: 1; }
}
.sideBadge.pulse{ animation: badgePulse 1.1s ease-in-out infinite; }

  </style>
</head>

<body>
  <div class="app">

    <div class="topbar">
      <div class="crumb logo">
        <img src="images/logog.png" alt="Logo">
      </div>

      <div class="top-actions">
        <label class="theme-switch" aria-label="Change theme">
          <input id="themeToggle" type="checkbox" />
          <span class="theme-track">
            <span class="theme-thumb"></span>
            <span class="theme-ico theme-ico--sun" aria-hidden="true">
              <img src="images/sun.svg" alt="" />
            </span>
            <span class="theme-ico theme-ico--moon" aria-hidden="true">
              <img src="images/moon.svg" alt="" />
            </span>
          </span>
        </label>

        <div class="pill" id="logoutBtn">Log out</div>
      </div>
    </div>

    <div class="layout">
      <aside class="sidebar glass">
        <nav class="sidenav" aria-label="Sidebar">
          <a class="sideitem" href="dashboard.html" data-tip="Dashboard">
            <img src="images/dashboard.svg" alt="Dashboard">
          </a>

          <a class="sideitem" href="patients.html" data-tip="Patients">
            <img src="images/person.svg" alt="Patients">
          </a>

 <script>
 
  const toggle = document.getElementById("themeToggle");
  const savedTheme = localStorage.getItem("theme");
  if (savedTheme === "dark") { document.body.classList.add("theme-dark"); toggle.checked = true; }
  toggle.addEventListener("change", () => {
    const isDark = toggle.checked;
    document.body.classList.toggle("theme-dark", isDark);
    localStorage.setItem("theme", isDark ? "dark" : "light");
  });

  document.getElementById("logoutBtn")?.addEventListener("click", () => {
    window.location.href = "index.html";
  });


  const PATIENTS_KEY = "patientsData_v5";        
  const PLANS_KEY    = "treatmentPlansData_v1";  

  
  function normalizePL(s){
    return String(s || "")
      .toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }
  function digitsOnly(s){
    return String(s || "").replace(/\D/g, "");
  }
  function pad2(n){ return String(n).padStart(2,"0"); }

  function formatBirthDate(dob){
    if (!dob || !dob.y || !dob.m || !dob.d) return "—";
    return `${pad2(dob.d)}.${pad2(dob.m)}.${dob.y}`;
  }

  function patientKey(p){
    return (p.pesel && String(p.pesel).trim()) ? `pesel:${p.pesel}` : `id:${p.id}`;
  }

  function loadPatients(){
    try{
      const raw = localStorage.getItem(PATIENTS_KEY);
      const arr = JSON.parse(raw || "[]");
      return Array.isArray(arr) ? arr : [];
    }catch{
      return [];
    }
  }
  function savePatients(patients){
    localStorage.setItem(PATIENTS_KEY, JSON.stringify(patients));
  }

  function loadPlans(){
    try{
      const raw = localStorage.getItem(PLANS_KEY);
      const arr = JSON.parse(raw || "[]");
      return Array.isArray(arr) ? arr : [];
    }catch{
      return [];
    }
  }
  function savePlans(plans){
    localStorage.setItem(PLANS_KEY, JSON.stringify(plans));
  }

  function nowISO(){ return new Date().toISOString(); }

  function makePlanId(){
    return "plan_" + Math.random().toString(16).slice(2) + "_" + Date.now().toString(16);
  }

  function matchesPlanQuery(plan, q){
    if (!q) return true;
    const qq = normalizePL(q.trim());
    const isDigits = /^\d+$/.test(q.trim());

    const fullName = normalizePL(`${plan.patient?.first || ""} ${plan.patient?.last || ""}`);
    const pesel = String(plan.patient?.pesel || "");
    const dob = formatBirthDate(plan.patient?.dob || {});
    const lastMod = String(plan.lastModified || "");

    if (isDigits){
      return pesel.includes(q.trim());
    }
    return (
      fullName.includes(qq) ||
      normalizePL(dob).includes(qq) ||
      normalizePL(lastMod).includes(qq)
    );
  }

  function formatLastModified(iso){
    if (!iso) return "—";
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return "—";
    return `${pad2(d.getDate())}.${pad2(d.getMonth()+1)}.${d.getFullYear()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  }


  const plansContainer = document.getElementById("plansContainer");
  const emptyState = document.getElementById("emptyState");
  const listSearch = document.getElementById("listSearch");
  const toggleSearchBtn = document.getElementById("toggleSearchBtn");
  const searchInput = document.getElementById("planSearch");

  const toggleSortBtn = document.getElementById("toggleSortBtn");
  const sortMenu = document.getElementById("sortMenu");

  let sortMode = "date_desc";

  let patients = loadPatients();
  let plans = loadPlans();

  function sortPlans(arr){
    const copy = [...arr];
    if (sortMode === "date_desc"){
      copy.sort((a,b) => String(b.lastModified||"").localeCompare(String(a.lastModified||"")));
    } else if (sortMode === "date_asc"){
      copy.sort((a,b) => String(a.lastModified||"").localeCompare(String(b.lastModified||"")));
    } else if (sortMode === "alpha_asc"){
      copy.sort((a,b) => {
        const la = normalizePL(a.patient?.last || "");
        const lb = normalizePL(b.patient?.last || "");
        if (la !== lb) return la < lb ? -1 : 1;
        const fa = normalizePL(a.patient?.first || "");
        const fb = normalizePL(b.patient?.first || "");
        if (fa !== fb) return fa < fb ? -1 : 1;
        return String(a.id||"").localeCompare(String(b.id||""));
      });
    } else if (sortMode === "alpha_desc"){
      copy.sort((a,b) => {
        const la = normalizePL(a.patient?.last || "");
        const lb = normalizePL(b.patient?.last || "");
        if (la !== lb) return la > lb ? -1 : 1;
        const fa = normalizePL(a.patient?.first || "");
        const fb = normalizePL(b.patient?.first || "");
        if (fa !== fb) return fa > fb ? -1 : 1;
        return String(b.id||"").localeCompare(String(a.id||""));
      });
    }
    return copy;
  }

  function planRowHTML(plan){
    const full = `${plan.patient?.first || ""} ${plan.patient?.last || ""}`.trim() || "—";
    const peselTxt = plan.patient?.pesel ? plan.patient.pesel : "—";
    const birthDateTxt = formatBirthDate(plan.patient?.dob || {});
    const lastModTxt = formatLastModified(plan.lastModified);

    return `
      <div class="planRow" data-plan-id="${plan.id}">
        <div class="avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5Z" fill="rgba(255,255,255,.95)"/>
          </svg>
        </div>

        <div class="pMain">
          <div class="pName">${full}</div>
          <div class="pMeta">
            <span class="chip"><strong>Birth date:</strong> ${birthDateTxt}</span>
            <span class="chip"><strong>PESEL:</strong> ${peselTxt}</span>
            <span class="chip"><strong>Last modified:</strong> ${lastModTxt}</span>
          </div>
        </div>

        <div class="pActions">
          <button class="btn primary" type="button" data-action="open">Treatment plan</button>
        </div>
      </div>
    `;
  }

  function renderPlans(){
    patients = loadPatients();

    plans = loadPlans().filter(p => p && p.isFinalized === true);

    const q = searchInput.value || "";
    const filtered = sortPlans(plans).filter(p => matchesPlanQuery(p, q));

    plansContainer.innerHTML = "";
    emptyState.style.display = filtered.length ? "none" : "";

    filtered.forEach(plan => {
      plansContainer.innerHTML += planRowHTML(plan);
    });
  }


  toggleSearchBtn.addEventListener("click", () => {
    const isOpen = listSearch.classList.toggle("open");
    if (isOpen) setTimeout(() => searchInput.focus(), 0);
  });

  let t = null;
  searchInput.addEventListener("input", () => {
    clearTimeout(t);
    t = setTimeout(renderPlans, 80);
  });


  function closeSortMenu(){ sortMenu.classList.remove("open"); }
  toggleSortBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    sortMenu.classList.toggle("open");
  });
  sortMenu.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-sort]");
    if (!btn) return;
    sortMode = btn.getAttribute("data-sort");
    closeSortMenu();
    renderPlans();
  });
  document.addEventListener("click", (e) => {
    if (!sortMenu.classList.contains("open")) return;
    if (e.target.closest("#sortMenu") || e.target.closest("#toggleSortBtn")) return;
    closeSortMenu();
  });

  plansContainer.addEventListener("click", (e) => {
    const row = e.target.closest(".planRow");
    if (!row) return;

    const actionBtn = e.target.closest("button[data-action]");
    if (!actionBtn) return;

    const planId = row.getAttribute("data-plan-id");
    const plan = loadPlans().find(p => p.id === planId);
    if (!plan) return;

    const params = new URLSearchParams();
    params.set("planId", planId);
    if (plan.patient?.pesel) params.set("pesel", plan.patient.pesel);
    if (plan.patient?.id) params.set("id", plan.patient.id);


    params.set("mode", "view");
    window.location.href = `createplan.html?${params.toString()}`;
  });


  const newPlanBtn = document.getElementById("newPlanBtn");

  const choiceOverlay = document.getElementById("choiceOverlay");
  const choiceClose = document.getElementById("choiceClose");
  const chooseFromPatients = document.getElementById("chooseFromPatients");
  const addNewPatient = document.getElementById("addNewPatient");

  const pickerOverlay = document.getElementById("pickerOverlay");
  const pickerClose = document.getElementById("pickerClose");
  const pickerCancel = document.getElementById("pickerCancel");
  const pickerList = document.getElementById("pickerList");
  const pickerSearch = document.getElementById("pickerSearch");
  const pickerEmpty = document.getElementById("pickerEmpty");

  function openOverlay(overlay){
    overlay.classList.add("open");
    overlay.setAttribute("aria-hidden","false");
  }
  function closeOverlay(overlay){
    overlay.classList.remove("open");
    overlay.setAttribute("aria-hidden","true");
  }

  newPlanBtn.addEventListener("click", () => openOverlay(choiceOverlay));

  choiceClose.addEventListener("click", () => closeOverlay(choiceOverlay));
  choiceOverlay.addEventListener("click", (e) => { if (e.target === choiceOverlay) closeOverlay(choiceOverlay); });

  function openPicker(){
    closeOverlay(choiceOverlay);
    openOverlay(pickerOverlay);
    setTimeout(() => pickerSearch.focus(), 0);
    renderPicker();
  }
  function closePicker(){
    closeOverlay(pickerOverlay);
    pickerSearch.value = "";
  }
  pickerClose.addEventListener("click", closePicker);
  pickerCancel.addEventListener("click", closePicker);
  pickerOverlay.addEventListener("click", (e) => { if (e.target === pickerOverlay) closePicker(); });

  chooseFromPatients.addEventListener("click", openPicker);
  chooseFromPatients.addEventListener("keydown", (e) => { if (e.key === "Enter") openPicker(); });

  function pickerMatches(p, q){
    if (!q) return true;
    const qq = normalizePL(q.trim());
    const isDigits = /^\d+$/.test(q.trim());
    const full = normalizePL(`${p.first} ${p.last}`);
    const pesel = String(p.pesel || "");
    if (isDigits) return pesel.includes(q.trim());
    return full.includes(qq);
  }

  function renderPicker(){
    const list = loadPatients();
    const q = pickerSearch.value || "";
    const filtered = list.filter(p => pickerMatches(p, q));

    pickerList.innerHTML = "";
    pickerEmpty.style.display = filtered.length ? "none" : "";

    filtered.forEach(p => {
      const full = `${p.first} ${p.last}`.trim();
      const dob = formatBirthDate(p.dob);
      const pesel = p.pesel ? p.pesel : "—";
      const key = patientKey(p);

      const el = document.createElement("div");
      el.className = "pickerRow";
      el.setAttribute("data-key", key);
      el.innerHTML = `
        <div class="avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5Z" fill="rgba(255,255,255,.95)"/>
          </svg>
        </div>
        <div>
          <div class="name">${full}</div>
          <div class="meta">
            <span><strong>Birth:</strong> ${dob}</span>
            <span><strong>PESEL:</strong> ${pesel}</span>
          </div>
        </div>
      `;
      pickerList.appendChild(el);
    });
  }

  let tt = null;
  pickerSearch.addEventListener("input", () => {
    clearTimeout(tt);
    tt = setTimeout(renderPicker, 80);
  });

  function createPlanForPatient(p){
    const key = patientKey(p);
    const all = loadPlans();

    const existing = all.find(x => x.patientKey === key && x.isFinalized === true);
    const params = new URLSearchParams();

    if (existing){
      params.set("planId", existing.id);
      if (p.pesel) params.set("pesel", p.pesel);
      if (p.id) params.set("id", p.id);
      params.set("mode", "view");
      window.location.href = `createplan.html?${params.toString()}`;
      return;
    }

    if (p.pesel) params.set("pesel", p.pesel);
    if (p.id) params.set("id", p.id);
    params.set("mode", "edit");
    window.location.href = `createplan.html?${params.toString()}`;
  }

  pickerList.addEventListener("click", (e) => {
    const row = e.target.closest(".pickerRow");
    if (!row) return;
    const key = row.getAttribute("data-key");
    const list = loadPatients();
    const p = list.find(x => patientKey(x) === key);
    if (!p) return;
    createPlanForPatient(p);
  });


  const patientFormOverlay = document.getElementById("patientFormOverlay");
  const modalClose = document.getElementById("modalClose");
  const modalCancel = document.getElementById("modalCancel");
  const modalSave = document.getElementById("modalSave");

  const fId    = document.getElementById("fId");
  const fPesel = document.getElementById("fPesel");
  const fFirst = document.getElementById("fFirst");
  const fLast  = document.getElementById("fLast");
  const fPhoneCc  = document.getElementById("fPhoneCc");
  const fPhoneNum = document.getElementById("fPhoneNum");
  const fDobY = document.getElementById("fDobY");
  const fDobM = document.getElementById("fDobM");
  const fDobD = document.getElementById("fDobD");
  const noPesel = document.getElementById("noPesel");

  function setFieldDisabled(input, disabled){
    input.disabled = !!disabled;
    input.classList.toggle("is-disabled", !!disabled);
    input.style.opacity = disabled ? ".55" : "1";
  }
  function setDobDisabled(disabled){
    setFieldDisabled(fDobY, disabled);
    setFieldDisabled(fDobM, disabled);
    setFieldDisabled(fDobD, disabled);
  }

  function validateNameNoDigits(val){ return !/\d/.test(String(val || "")); }
  function validatePesel(pesel){ return /^\d{11}$/.test(String(pesel || "").trim()); }
  function validateId(id){ return /^[A-Za-z0-9]+$/.test(String(id || "").trim()); }
  function validatePhone(ccDigits, numDigits){
    const cc = digitsOnly(ccDigits);
    const num = digitsOnly(numDigits);
    return cc.length >= 1 && cc.length <= 3 && num.length >= 6 && num.length <= 15;
  }

  function validateYear4(y){ return /^\d{4}$/.test(String(y || "").trim()); }
  function validateMonth(m){ const n = Number(m); return Number.isInteger(n) && n >= 1 && n <= 12; }
  function validateDay(d){ const n = Number(d); return Number.isInteger(n) && n >= 1 && n <= 31; }

  function isRealDate(y, m, d){
    const yy = Number(y), mm = Number(m), dd = Number(d);
    if (!Number.isInteger(yy) || !Number.isInteger(mm) || !Number.isInteger(dd)) return false;
    const dt = new Date(yy, mm - 1, dd);
    return dt.getFullYear() === yy && (dt.getMonth() + 1) === mm && dt.getDate() === dd;
  }

  function dobFromPesel(pesel){
    const p = String(pesel || "").trim();
    if (!/^\d{11}$/.test(p)) return null;

    let yy = Number(p.slice(0,2));
    let mm = Number(p.slice(2,4));
    const dd = Number(p.slice(4,6));

    let century = 1900;
    if (mm >= 81 && mm <= 92){ century = 1800; mm -= 80; }
    else if (mm >= 1 && mm <= 12){ century = 1900; }
    else if (mm >= 21 && mm <= 32){ century = 2000; mm -= 20; }
    else if (mm >= 41 && mm <= 52){ century = 2100; mm -= 40; }
    else if (mm >= 61 && mm <= 72){ century = 2200; mm -= 60; }
    else { return null; }

    const yyyy = century + yy;

    if (!validateYear4(String(yyyy))) return null;
    if (!validateMonth(mm) || !validateDay(dd)) return null;
    if (!isRealDate(yyyy, mm, dd)) return null;

    return { y: yyyy, m: mm, d: dd };
  }

  function syncDobFromPeselIfPossible(){
    const useId = noPesel.checked;

    if (useId){
      setDobDisabled(false);
      return;
    }

    const p = fPesel.value.trim();
    if (p.length !== 11){
      setDobDisabled(false);
      return;
    }

    const dob = dobFromPesel(p);
    if (!dob){
      setDobDisabled(false);
      return;
    }

    fDobY.value = String(dob.y);
    fDobM.value = String(dob.m);
    fDobD.value = String(dob.d);

    setDobDisabled(true);
  }

  function applyPeselOrIdRules(){
    const useId = noPesel.checked;

    setFieldDisabled(fPesel, useId);
    if (useId) fPesel.value = "";

    setFieldDisabled(fId, !useId);
    if (!useId) fId.value = "";

    syncDobFromPeselIfPossible();
  }
  noPesel.addEventListener("change", applyPeselOrIdRules);

  fPhoneCc.addEventListener("input", () => {
    const d = digitsOnly(fPhoneCc.value);
    fPhoneCc.value = d ? ("+" + d) : "+";
  });
  function formatPhoneNumber(numDigits){
    const d = digitsOnly(numDigits);
    if (!d) return "";
    return d.replace(/(\d{3})(?=\d)/g, "$1 ").trim();
  }
  fPhoneNum.addEventListener("input", () => {
    const d = digitsOnly(fPhoneNum.value);
    fPhoneNum.value = formatPhoneNumber(d);
  });

  function clampInt(val, min, max){
    const n = parseInt(digitsOnly(val), 10);
    if (Number.isNaN(n)) return "";
    return String(Math.min(max, Math.max(min, n)));
  }
  fDobY.addEventListener("input", () => { fDobY.value = digitsOnly(fDobY.value).slice(0,4); });
  fDobM.addEventListener("input", () => {
    const raw = digitsOnly(fDobM.value).slice(0,2);
    fDobM.value = raw ? clampInt(raw, 1, 12) : "";
  });
  fDobD.addEventListener("input", () => {
    const raw = digitsOnly(fDobD.value).slice(0,2);
    fDobD.value = raw ? clampInt(raw, 1, 31) : "";
  });

  fPesel.addEventListener("input", () => {
    fPesel.value = digitsOnly(fPesel.value).slice(0,11);
    syncDobFromPeselIfPossible();
  });

  function openPatientForm(){
    closeOverlay(choiceOverlay);

    document.getElementById("modalTitle").textContent = "Add new patient";
    noPesel.checked = false;

    fId.value = "";
    fPesel.value = "";
    fFirst.value = "";
    fLast.value  = "";
    fPhoneCc.value = "+48";
    fPhoneNum.value = "";

    fDobY.value = "";
    fDobM.value = "";
    fDobD.value = "";

    applyPeselOrIdRules();
    openOverlay(patientFormOverlay);
    setTimeout(() => fFirst.focus(), 0);
  }

  function closePatientForm(){
    closeOverlay(patientFormOverlay);
  }

  addNewPatient.addEventListener("click", openPatientForm);
  addNewPatient.addEventListener("keydown", (e) => { if (e.key === "Enter") openPatientForm(); });

  modalClose.addEventListener("click", closePatientForm);
  modalCancel.addEventListener("click", closePatientForm);
  patientFormOverlay.addEventListener("click", (e) => { if (e.target === patientFormOverlay) closePatientForm(); });

  function alertIncomplete(){
    alert("Incomplete data");
  }

  modalSave.addEventListener("click", () => {
    const useId = noPesel.checked;

    const updated = {
      id: useId ? fId.value.trim() : "",
      pesel: useId ? "" : fPesel.value.trim(),
      first: fFirst.value.trim(),
      last:  fLast.value.trim(),
      dob: {
        y: digitsOnly(fDobY.value),
        m: digitsOnly(fDobM.value),
        d: digitsOnly(fDobD.value)
      },
      phone: {
        ccDigits: digitsOnly(fPhoneCc.value),
        numDigits: digitsOnly(fPhoneNum.value)
      }
    };

    if (
      !updated.first || !updated.last ||
      !updated.phone.ccDigits || !updated.phone.numDigits ||
      !updated.dob.y || !updated.dob.m || !updated.dob.d
    ){
      alertIncomplete(); return;
    }
    if (useId && !updated.id){ alertIncomplete(); return; }
    if (!useId && !updated.pesel){ alertIncomplete(); return; }

    if (!validateNameNoDigits(updated.first) || !validateNameNoDigits(updated.last)){
      alert("First name and last name cannot contain digits.");
      return;
    }

    if (!validatePhone(updated.phone.ccDigits, updated.phone.numDigits)){
      alert("Invalid phone number.");
      return;
    }

    if (useId){
      if (!validateId(updated.id)){
        alert("ID can contain only letters and digits (no spaces).");
        return;
      }
      if (!validateYear4(updated.dob.y)){
        alert("Birth year must be 4 digits.");
        return;
      }
      if (!validateMonth(Number(updated.dob.m)) || !validateDay(Number(updated.dob.d))){
        alert("Birth month must be 1-12 and day 1-31.");
        return;
      }
      if (!isRealDate(Number(updated.dob.y), Number(updated.dob.m), Number(updated.dob.d))){
        alert("This birth date does not exist.");
        return;
      }
    } else {
      if (!validatePesel(updated.pesel)){
        alert("PESEL must be 11 digits.");
        return;
      }
      const dob = dobFromPesel(updated.pesel);
      if (!dob){
        alert("PESEL contains an invalid birth date (first 6 digits).");
        return;
      }
      updated.dob = dob;
    }

    const list = loadPatients();
    const newKey = patientKey(updated);

    const existsSameKey = list.some(p => patientKey(p) === newKey);
    if (existsSameKey){
      alert("A patient with this identifier already exists.");
      return;
    }

    list.push(updated);
    savePatients(list);

    closePatientForm();

    createPlanForPatient(updated);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    [choiceOverlay, pickerOverlay, patientFormOverlay].forEach(ov => {
      if (ov.classList.contains("open")) closeOverlay(ov);
    });
    closeSortMenu();
  });


  renderPlans();

  const NOTIF_KEY = "notificationsData_v1";
  const NOTIF_CHANNEL = "notifications_sync_v1";
  const notiBC = ("BroadcastChannel" in window) ? new BroadcastChannel(NOTIF_CHANNEL) : null;

  function ensureSidebarUnreadBadge(){
    let badge = document.getElementById("sidebarUnreadBadge");
    if (badge) return badge;

    const notifLink =
      document.querySelector('.sidenav a[href="notifications.html"]') ||
      document.querySelector('.sidenav a[data-tip="Notifications"]');

    if (!notifLink) return null;

    badge = document.createElement("span");
    badge.className = "sideBadge";
    badge.id = "sidebarUnreadBadge";
    badge.setAttribute("aria-hidden","true");
    badge.textContent = "0";
    notifLink.appendChild(badge);
    return badge;
  }

  function loadNotificationsSafe(){
    try{
      const raw = localStorage.getItem(NOTIF_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    }catch{
      return [];
    }
  }

  function countUnread(list){
    return list.reduce((acc,n) => acc + (!n?.deletedAt && !n?.readAt ? 1 : 0), 0);
  }

  let prevUnread = 0;

  function updateUnreadBadge(){
    const badge = document.getElementById("sidebarUnreadBadge") || ensureSidebarUnreadBadge();
    if (!badge) return;

    const list = loadNotificationsSafe();
    const unread = countUnread(list);

    if (unread > 0){
      badge.style.display = "block";
      badge.textContent = String(unread);
      badge.classList.add("pulse");

      if (unread > prevUnread){
        badge.classList.remove("pop");
        void badge.offsetWidth;
        badge.classList.add("pop");
      }
    } else {
      badge.style.display = "none";
      badge.classList.remove("pulse");
    }
    prevUnread = unread;
  }

  updateUnreadBadge();

  window.addEventListener("storage", (e) => {
    if (e.key === NOTIF_KEY) updateUnreadBadge();
  });

  if (notiBC){
    notiBC.addEventListener("message", (ev) => {
      if (ev?.data?.type === "changed") updateUnreadBadge();
    });
  }
   const currentDoctorName =
    localStorage.getItem("currentDoctorName") ||
    localStorage.getItem("currentUserName") ||
    localStorage.getItem("loggedUserName") ||
    localStorage.getItem("doctorName") ||
    "Dr Anna Nowak";

  const TASKS_KEY = "tasksData_v1";
  const TASKS_PING_KEY = "tasksPing_v1";
  const TASKS_CHANNEL = "tasks_sync_v1";

  const tasksBC = ("BroadcastChannel" in window)
    ? new BroadcastChannel(TASKS_CHANNEL)
    : null;

  function fromISODate(s){
    const [y,m,d] = String(s).split("-").map(Number);
    return new Date(y, (m||1)-1, d||1);
  }
  function startOfDay(d){
    const x = new Date(d);
    x.setHours(0,0,0,0);
    return x;
  }
  function daysDiff(fromDate, toDate){
    const a = startOfDay(fromDate).getTime();
    const b = startOfDay(toDate).getTime();
    return Math.round((b - a) / (24*60*60*1000));
  }
  function safeJSONParse(raw, fallback){
    try{
      const v = raw ? JSON.parse(raw) : null;
      return (v === null || v === undefined) ? fallback : v;
    }catch{
      return fallback;
    }
  }
  function loadTasksSafe(){
    const arr = safeJSONParse(localStorage.getItem(TASKS_KEY), []);
    return Array.isArray(arr) ? arr : [];
  }

  function ensureSidebarTasksBadge(){
    let badge = document.getElementById("sidebarTasksBadge");
    if (badge) return badge;

    const tasksLink =
      document.querySelector('.sidenav a[href="task.html"]') ||
      document.querySelector('.sidenav a[data-tip="Tasks"]');

    if (!tasksLink) return null;

    badge = document.createElement("span");
    badge.className = "sideBadge";
    badge.id = "sidebarTasksBadge";
    badge.setAttribute("aria-hidden","true");
    badge.textContent = "0";
    tasksLink.appendChild(badge);
    return badge;
  }

  function updateTasksBadgeGlobal(){
    const badge = document.getElementById("sidebarTasksBadge") || ensureSidebarTasksBadge();
    if (!badge) return;

    const tasks = loadTasksSafe();
    const now = new Date();

    const mineOpen = tasks.filter(t =>
      t && t.status !== "done" && t.assignedTo === currentDoctorName
    );

    const count = mineOpen.reduce((acc, t) => {
      const diff = daysDiff(now, fromISODate(t.dueDate));
      if (diff < 0) return acc + 1;
      if (diff <= 2) return acc + 1;
      return acc;
    }, 0);

    if (count > 0){
      badge.style.display = "block";
      badge.textContent = String(count);
      badge.classList.add("pulse");
    } else {
      badge.style.display = "none";
      badge.classList.remove("pulse");
    }
  }

  updateTasksBadgeGlobal();

  window.addEventListener("storage", (e) => {
    if (e.key === TASKS_KEY || e.key === TASKS_PING_KEY){
      updateTasksBadgeGlobal();
    }
  });

  if (tasksBC){
    tasksBC.addEventListener("message", (ev) => {
      if (ev?.data?.type === "changed") updateTasksBadgeGlobal();
    });
  }
</script>

</body>
</html>
